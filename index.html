<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country-Explorer-App</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="https://d1nhio0ox7pgb.cloudfront.net/_img/g_collection_png/standard/256x256/leaf.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
    <!-- Navbar -->
     <header class="bg-sky-700 text-white">
        <div class="max-w-6xl mx-auto p-4">
            <h1 class="text-2xl font-bold">Country Explorer</h1>
        </div>
     </header>

     <main class="max-w-6xl mx-auto px-4 py-6">
        <!-- Search and filter -->
         <div class="flex flex-col md:flex-row gap-3 mb-6">
        <input  
        type="text"
        id="search"
        placeholder="Search Country By Name"
        class="flex-1 border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2
        focus:ring-sky-500"
        />
        <select 
        id="region"
        class="border border-slate-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2
        focus:ring-sky-500">
         <option value="">All Region</option>
         <option>Africa</option>
         <option>America</option>
         <option>Asia</option>
         <option>Europe</option>
         <option>Oceania</option>
        
        </select>
      </div>


      <p id="status" class="text-center text-slate-500 py-10"></p>

      <!-- Cards  -->
       <div 
        id="grid"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5"
       ></div>
     </main>
    
    <script src="./script.js"></script>
    

</body>
</html>
